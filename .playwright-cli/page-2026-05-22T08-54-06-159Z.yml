        - heading "Главные риски проекта и способы их минимизации:" [level=3] [ref=e149]
        - generic [ref=e150]:
          - generic [ref=e151]:
            - generic [ref=e153]: ⚠️ Ложные обвинения абонентов
            - paragraph [ref=e154]: Небаланс энергии на фидере может быть вызван утечками, авариями или ошибками учета, а не кражами.
            - paragraph [ref=e155]:
              - strong [ref=e156]: "Минимизация:"
              - text: Четкое разделение этапов («сигнал» → «подозрение» → «доказанная аномалия»). Любые выводы ИИ перепроверяются ручными замерами мобильных групп.
          - generic [ref=e157]:
            - generic [ref=e159]: ⚖️ Отсутствие юридической силы
            - paragraph [ref=e160]: Данные БПЛА и внешних измерений могут не признаваться судами как легальные доказательства.
            - paragraph [ref=e161]:
              - strong [ref=e162]: "Минимизация:"
              - text: Разработка правовой базы до закупки оборудования. Фиксация нарушений сертифицированными приборами и проведение «Gate 0» юридического аудита.
          - generic [ref=e163]:
            - generic [ref=e165]: 🛸 Privacy-конфликты при съемке БПЛА
            - paragraph [ref=e166]: Съемка частных территорий дронами вызывает сопротивление граждан и обвинения в нарушении прав.
            - paragraph [ref=e167]:
              - strong [ref=e168]: "Минимизация:"
              - text: Строгие регламенты полетов (EASA Specific Category). Автоматическое маскирование лиц и окон. Хранение снимков только с аномалиями.
          - generic [ref=e169]:
            - generic [ref=e171]: 🔨 Саботаж и вандализм датчиков
            - paragraph [ref=e172]: Уличные датчики на опорах и шкафы Pole-box могут физически уничтожаться нарушителями.
            - paragraph [ref=e173]:
              - strong [ref=e174]: "Минимизация:"
              - text: Высотный антивандальный монтаж (более 5.5 м), встроенные акселерометры вскрытия (tamper alarms) и моментальный аларм в ПО при потере связи.
          - generic [ref=e175]:
            - generic [ref=e177]: 🗺️ Ошибки ГИС-карты сети
            - paragraph [ref=e178]: Отсутствие верной привязки «ТП → опора → дом» сделает балансовый расчет невозможным.
            - paragraph [ref=e179]:
              - strong [ref=e180]: "Минимизация:"
              - text: Фаза 1 полностью посвящена полевому ГИС-картированию. Создание живого графа сети с возможностью быстрой коррекции топологии инженером.
          - generic [ref=e181]:
            - generic [ref=e183]: 🔒 Подмена данных и кибератаки
            - paragraph [ref=e184]: Злоумышленники могут перехватывать LoRaWAN/NB-IoT пакеты для занижения реальных показаний.
            - paragraph [ref=e185]:
              - strong [ref=e186]: "Минимизация:"
              - text: Соответствие требованиям NIST SP 800-213A. Аппаратное шифрование AES-128/256, индивидуальные ключи для каждого датчика, контроль версий прошивок.
          - generic [ref=e187]:
            - generic [ref=e189]: ✊ Социальное сопротивление населения
            - paragraph [ref=e190]: Массовые отключения в бедных районах могут спровоцировать общественные беспорядки.
            - paragraph [ref=e191]:
              - strong [ref=e192]: "Минимизация:"
              - text: "Эффективное информирование. Переход от наказания к легализации: социальные лимиты, программы лояльности, внедрение prepaid split-metering."
          - generic [ref=e193]:
            - generic [ref=e195]: 🔌 Зависимость от одного вендора
            - paragraph [ref=e196]: Закрытые протоколы обмена данными датчиков привязывают заказчика к одному поставщику.
            - paragraph [ref=e197]:
              - strong [ref=e198]: "Минимизация:"
              - text: Использование открытых API и стандартизированных протоколов связи (MQTT, LoRaWAN, DLMS/COSEM) для бесшовной замены железа.
          - generic [ref=e199]:
            - generic [ref=e201]: 📈 Бесполезные облеты БПЛА без ТЭО
            - paragraph [ref=e202]: Огромный массив видеосъемки без балансов энергии быстро превратится в "цифровой мусор".
            - paragraph [ref=e203]:
