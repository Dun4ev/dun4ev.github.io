<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Документация · рассмотрение и сводный ответ</title><style>*{box-sizing:border-box}body{margin:0;background:#dddcd6;color:#20333c;font:14px system-ui;display:flex;align-items:center;flex-direction:column;padding:18px;gap:12px}canvas{display:block;width:auto;max-width:100%;height:min(82vh,960px);background:#f5f2e9}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}button{background:#20333c;color:#fff;border:0;padding:10px 16px;border-radius:3px;cursor:pointer}input{width:150px}a{color:#20333c}small{max-width:500px;text-align:center}</style><canvas id="c" aria-label="Передача документации, рассмотрение институтом, заказчиком и EPC, сводный ответ вендору"></canvas><nav><a id="language" href="?lang=en">English</a><button id="play">Пауза</button><input id="seek" type="range" min="0" max="359" value="0" aria-label="Кадр"><span id="time"></span><a href="?grid=12">Контрольный лист</a></nav><small>12 секунд · вендор → EPC → институт и заказчик → сводный ответ</small><script>
const C=document.getElementById('c'),q=new URLSearchParams(location.search),EN=q.get('lang')==='en',FPS=30,TOTAL=360,SEED=Number(q.get('s')||7),W=Number(q.get('w')||1080);let ctx;
const ink='#203740',orange='#d85b35',blue='#246a8b',paper='#f5f2e9';
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const EN_TEXT={"НА РАССМОТРЕНИЕ":"FOR REVIEW","01  ПЕРЕДАЧА":"01  SUBMIT","02  РАССМОТРЕНИЕ":"02  REVIEW","03  ОТВЕТ EPC":"03  EPC REPLY","Рассмотрение":"Review","всеми сторонами":"by all parties","EPC координирует общий цикл":"EPC coordinates the review","EPC-подрядчик":"EPC contractor","Рассылка и собственная проверка":"Distributes and reviews","Проектный институт":"Design institute","Проверка проектных решений":"Design review","Заказчик":"Client","Проверка требований":"Requirements review","Замечания и статусы → EPC":"Comments and status → EPC","Документы → на рассмотрение":"Documents → for review","EPC: техническая проверка":"EPC: technical review","Институт: проектные решения":"Institute: design decisions","Заказчик: требования к объекту":"Client: project requirements","Получено":"Received","Проверка":"Review","Параллельное рассмотрение":"Parallel review","Все ответы поступают в EPC":"All replies reach EPC","Согласование или замечания по каждому документу":"Approval or comments on each document","Единый ответ":"Consolidated reply","от EPC":"from EPC","Замечания и согласования всех сторон":"Comments and approvals from all parties","Институт":"Institute","EPC / СВОДНЫЙ ОТВЕТ":"EPC / CONSOLIDATED REPLY","Пакет VDR-024 · статусы по чертежам":"Package VDR-024 · drawing status","ДОКУМЕНТ":"DOCUMENT","РЕЗУЛЬТАТ РАССМОТРЕНИЯ":"REVIEW RESULT","Чертеж 01":"Drawing 01","Чертеж 02":"Drawing 02","Чертеж 03":"Drawing 03","Согласовано":"Approved","Учесть замечания":"Revise per comments","Приложение: общий реестр замечаний":"Annex: consolidated comment log","Источник каждого замечания сохранен":"Each comment retains its source","Вендор":"Vendor","Получает консолидированный ответ":"Receives the consolidated reply","Учитывает замечания и выпускает ревизию":"Addresses comments and revises","EPC объединяет ответы сторон":"EPC consolidates all replies","Один ответ по всему пакету":"One reply for the whole package","ДВИЖЕНИЕ ДОКУМЕНТАЦИИ":"DOCUMENTATION WORKFLOW","От вендора":"From vendor","к EPC":"to EPC","Пакет для рассмотрения решений":"Package for design review","ВЕНДОР":"VENDOR","Техническая документация":"Technical documentation","Чертеж":"Drawing","Спецификация":"Specification","Расчеты":"Calculations","EPC-ПОДРЯДЧИК":"EPC CONTRACTOR","Прием и регистрация":"Receipt and registration","Далее: проверка специалистами":"Next: specialist review","ЗАРЕГИСТРИРОВАНО":"REGISTERED","Формирование пакета":"Preparing the package","Передача в EPC":"Submitted to EPC","Пакет получен EPC":"Package received by EPC","Чертеж · спецификация · расчеты":"Drawing · specification · calculations","Документы ожидают рассмотрения":"Documents await review","Передача пакета от вендора к EPC":"Vendor package submitted to EPC","Рассмотрение всеми сторонами":"Review by all parties","Сводный ответ EPC вендору":"EPC consolidated reply to vendor"};function tr(s){return EN?(EN_TEXT[s]||s):s}
function text(s,x,y,size=16,color=ink,bold=false){s=tr(s);ctx.fillStyle=color;ctx.font=`${bold?'bold ':''}${size}px Arial`;while(ctx.measureText(s).width>Math.max(70,504-x)&&size>9){size--;ctx.font=`${bold?'bold ':''}${size}px Arial`}ctx.fillText(s,x,y)}
function line(x,y,a,b,color=ink,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke()}
function box(x,y,w,h,color,stroke){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h)}}
function dot(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function doc(x,y,angle,kind,seed){ctx.save();ctx.translate(x,y);ctx.rotate(angle);box(-81,-106,166,216,'#dedbd1');box(-86,-112,166,216,'#fffdf6',ink);box(-86,-112,166,8,orange);text('VDR / 024',-70,-82,12,orange,true);text(kind,-70,-55,18,ink,true);line(-70,-40,64,-40,'#bbc3c0');
if(kind==='Чертеж'){ctx.strokeStyle=blue;ctx.lineWidth=2;ctx.strokeRect(-47,-20,87,54);line(-59,7,53,7,blue,2);dot(-3,7,20,paper);ctx.strokeStyle=blue;ctx.stroke();line(-55,49,49,49,blue);line(-55,44,-55,54,blue);line(49,44,49,54,blue)}else{for(let k=0;k<4;k++)line(-68,-20+k*18,48-((seed+k*19)%28),-20+k*18,'#87999d',2)}
line(-70,68,64,68,'#bbc3c0');text('REV. 0',-70,88,11,ink,true);text('НА РАССМОТРЕНИЕ',-16,88,8,ink);ctx.restore()}

function footer(n,stage){line(36,921,504,921,'#c8cec5',3);line(36,921,36+468*n/359,921,orange,3);['01  ПЕРЕДАЧА','02  РАССМОТРЕНИЕ','03  ОТВЕТ EPC'].forEach((s,i)=>text(s,[36,209,415][i],944,10,i===stage?orange:'#738386',i===stage))}
function actor(x,y,w,title,sub,color=blue){box(x,y,w,80,'#e7ece8',color);box(x,y,4,80,color);text(title,x+14,y+29,18,color,true);text(sub,x+14,y+56,13,ink)}
function packet(x,y,color=orange){box(x-13,y-17,26,34,'#fffdf6',color);line(x-8,y-7,x+8,y-7,color,2);line(x-8,y,x+8,y,color);line(x-8,y+7,x+5,y+7,color)}
function travel(x,y,a,b,t,color){line(x,y,a,b,'#a6b7b6',2);packet(x+(a-x)*ease(t),y+(b-y)*ease(t),color)}
function review(n){const f=n-120; text('02 / 03',450,43,12,ink);text('Рассмотрение',36,116,40,ink,true);text('всеми сторонами',36,166,36,ink,true);text('EPC координирует общий цикл',38,202,18,'#61767a');
actor(130,252,280,'EPC-подрядчик','Рассылка и собственная проверка');
const returned=f>=65,t=returned?(f-65)/34:f/32;
travel(returned?140:270,returned?473:342,returned?270:140,returned?342:473,t,returned?blue:orange);
travel(returned?400:270,returned?473:342,returned?270:400,returned?342:473,t,returned?blue:orange);
actor(36,485,224,'Проектный институт','Проверка проектных решений');actor(280,485,224,'Заказчик','Проверка требований');
text(returned?'Замечания и статусы → EPC':'Документы → на рассмотрение',82,620,21,ink,true);
const labels=['EPC: техническая проверка','Институт: проектные решения','Заказчик: требования к объекту'];labels.forEach((v,i)=>{const ready=f>=80+i*10;box(36,654+i*49,468,40,ready?'#dce9e8':'#ebe8de');text(v,49,680+i*49,16,ink);text(ready?'Получено':'Проверка',412,680+i*49,12,ready?blue:'#61767a',true)});
text(f<65?'Параллельное рассмотрение':'Все ответы поступают в EPC',36,864,23,ink,true);text('Согласование или замечания по каждому документу',36,892,15,'#61767a');footer(n,1)}
function response(n){const f=n-240,t=ease((f-66)/28);text('03 / 03',450,43,12,ink);text('Единый ответ',36,116,43,ink,true);text('от EPC',36,166,43,ink,true);text('Замечания и согласования всех сторон',38,202,17,'#61767a');
['EPC','Институт','Заказчик'].forEach((v,i)=>{box(36+i*160,237,148,40,'#dce9e8',blue);text(v,49+i*160,263,16,blue,true);line(110+i*160,278,270,324,'#a6b7b6',1.5)});
let y=332+t*38;box(45,y+5,456,340,'#dedbd1');box(40,y,456,340,'#fffdf6',ink);box(40,y,456,6,blue);text('EPC / СВОДНЫЙ ОТВЕТ',57,y+37,22,ink,true);text('Пакет VDR-024 · статусы по чертежам',57,y+65,16,'#61767a');line(57,y+83,478,y+83,'#bbc3c0');
text('ДОКУМЕНТ',57,y+108,12,ink,true);text('РЕЗУЛЬТАТ РАССМОТРЕНИЯ',210,y+108,12,ink,true);
[['Чертеж 01','Согласовано',blue],['Чертеж 02','Учесть замечания',orange],['Чертеж 03','Согласовано',blue]].forEach((row,i)=>{ctx.save();ctx.globalAlpha=ease((f-i*8)/15);text(row[0],57,y+146+i*43,16,ink,true);text(row[1],210,y+146+i*43,16,row[2],true);line(57,y+160+i*43,478,y+160+i*43,'#d9dfd9');ctx.restore()});
text('Приложение: общий реестр замечаний',57,y+287,15,ink);text('Источник каждого замечания сохранен',57,y+312,14,'#61767a');
if(f>60)travel(270,720,270,765,(f-60)/32,blue);
actor(36,777,468,'Вендор',f<95?'Получает консолидированный ответ':'Учитывает замечания и выпускает ревизию',orange);
text(f<65?'EPC объединяет ответы сторон':'Один ответ по всему пакету',36,889,21,ink,true);footer(n,2)}

function draw(n,w=1080,seed=7,target=C){n=Math.max(0,Math.min(TOTAL-1,Math.floor(n)));target.width=w;target.height=Math.round(w*16/9);ctx=target.getContext('2d');ctx.scale(w/540,w/540);box(0,0,540,960,paper);
for(let y=24;y<940;y+=24)for(let x=24;x<530;x+=24)dot(x,y,.65,'#d8ddd6');
text('ДВИЖЕНИЕ ДОКУМЕНТАЦИИ',36,43,12,ink,true);if(n>=120){line(36,59,504,59,'#a5b2af');if(n<240)review(n);else response(n);return target;}text('01 / 03',450,43,12,ink);line(36,59,504,59,'#a5b2af');
text('От вендора',36,116,43,ink,true);text('к EPC',36,166,43,ink,true);text('Пакет для рассмотрения решений',38,202,18,'#61767a');
// Fixed actors and central transmission axis.
box(36,242,468,82,'#ebe8de', '#c3c9bf');box(36,242,5,82,orange);text('ВЕНДОР',57,272,13,orange,true);text('Техническая документация',57,302,21,ink,true);
ctx.setLineDash([4,7]);line(270,334,270,682,'#a6b7b6',2);ctx.setLineDash([]);
let move=ease((n-30)/56),gather=ease(n/24),arrive=ease((n-85)/15);let y=465+move*120;
// The packet consolidates, travels, then settles into the EPC inbox.
for(let i=2;i>=0;i--){let spread=(1-gather)*30;doc(270+(i-1)*spread+(i-1)*9,y-(i)*8,((i-1)*(1-gather)*.13)+(i-1)*.025,['Чертеж','Спецификация','Расчеты'][i],seed+i)}
if(n>30&&n<90){let yy=346+move*319;dot(466,yy,5,orange);line(466,346,466,yy,orange,2)}
box(36,714,468,100,arrive>.3?'#dce9e8':'#e7ece8',blue);box(36,714,5,100,blue);text('EPC-ПОДРЯДЧИК',57,744,13,blue,true);text('Прием и регистрация',57,776,23,ink,true);text('Далее: проверка специалистами',57,800,14,'#61767a');
if(arrive>0){ctx.save();ctx.globalAlpha=arrive;box(298,661,192,34,blue);text('ЗАРЕГИСТРИРОВАНО',311,683,13,'#fffdf6',true);ctx.restore()}
let status=n<30?'Формирование пакета':n<86?'Передача в EPC':'Пакет получен EPC';text(status,36,864,22,ink,true);text(n<86?'Чертеж · спецификация · расчеты':'Документы ожидают рассмотрения',36,892,15,'#61767a');
footer(n,0);return target;}
function contact(count=12,cellWidth=270){count=Math.max(1,Math.min(48,Math.floor(count)));const sheet=document.createElement('canvas'),cols=Math.min(4,count),h=Math.round(cellWidth*16/9),pad=18,label=28;sheet.width=cols*(cellWidth+pad)+pad;sheet.height=Math.ceil(count/cols)*(h+label+pad)+pad;const g=sheet.getContext('2d');g.fillStyle='#deded6';g.fillRect(0,0,sheet.width,sheet.height);for(let i=0;i<count;i++){let f=Math.round(i*(TOTAL-1)/Math.max(1,count-1)),tmp=document.createElement('canvas');draw(f,cellWidth,SEED,tmp);let x=pad+(i%cols)*(cellWidth+pad),y=pad+Math.floor(i/cols)*(h+label+pad);g.drawImage(tmp,x,y);g.fillStyle=ink;g.font='13px Arial';g.fillText(`${(f/FPS).toFixed(2)} ${EN?'sec / frame':'с / кадр'} ${f}`,x,y+h+19)}return sheet}
window.RISO={get total(){return TOTAL},fps:FPS,plannedTotal:360,frame(n,w=1080,s=7){return draw(n,w,s,document.createElement('canvas')).toDataURL('image/png')},contact(n=12,w=270){return contact(n,w).toDataURL('image/png')},plates:[{name:'Передача пакета от вендора к EPC',len:120},{name:'Рассмотрение всеми сторонами',len:120},{name:'Сводный ответ EPC вендору',len:120}]};
let f=Number(q.get('f')||0),playing=!q.has('f')&&!matchMedia('(prefers-reduced-motion: reduce)').matches,prev=0;const play=document.getElementById('play'),seek=document.getElementById('seek'),timer=document.getElementById('time');function show(){draw(f,W,SEED);seek.value=f;timer.textContent=(f/FPS).toFixed(2)+(EN?' / 12.00 sec':' / 12.00 с');play.textContent=playing?(EN?'Pause':'Пауза'):(EN?'Play':'Воспроизвести');document.getElementById('language').href='?'+(EN?'':'lang=en&')+'f='+Math.floor(f)}
play.onclick=()=>{playing=!playing;prev=0;show()};seek.oninput=()=>{playing=false;f=Number(seek.value);show()};
if(q.has('grid')){let sheet=contact(Number(q.get('grid')),270);C.width=sheet.width;C.height=sheet.height;C.getContext('2d').drawImage(sheet,0,0);C.style.height='auto';C.style.width='min(100%, 1168px)';document.querySelector('nav').style.display='none'}else{show();requestAnimationFrame(function tick(t){if(playing){if(prev){f=(f+(t-prev)*FPS/1000)%TOTAL}show()}prev=t;requestAnimationFrame(tick)})}document.documentElement.lang=EN?'en':'ru';document.title=EN?'Documentation · review and consolidated reply':'Документация · рассмотрение и сводный ответ';document.querySelector('small').textContent=EN?'12 seconds · vendor → EPC → institute and client → consolidated reply':'12 секунд · вендор → EPC → институт и заказчик → сводный ответ';document.getElementById('seek').setAttribute('aria-label',EN?'Frame':'Кадр');C.setAttribute('aria-label',EN?'Documentation goes to EPC, design institute and client for review; EPC sends a consolidated reply':'Передача документации, рассмотрение институтом, заказчиком и EPC, сводный ответ вендору');const gridLink=document.querySelector('nav a[href^="?grid"]');gridLink.textContent=EN?'Contact sheet':'Контрольный лист';gridLink.href='?grid=12'+(EN?'&lang=en':'');const language=document.getElementById('language');language.textContent=EN?'Русский':'English';language.href='?'+(EN?'':'lang=en&')+'f='+Math.floor(f)+(q.has('grid')?'&grid='+encodeURIComponent(q.get('grid')):'');window.__ready=true;
