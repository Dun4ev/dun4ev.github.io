name: Update GitHub Contributions

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Dun4ev
        run: node scripts/update-github-contributions.mjs

      - name: Commit updated data
        run: |
          if git diff --quiet -- public/data/github-contributions.json; then
            echo "No contribution data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/github-contributions.json
          git commit -m "Update GitHub contribution data"
          git pull --rebase origin main
          git push

      - name: Build
        run: npm run build && npm run check:seo

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.update.outputs.artifact_id }}
        run: |
          for delay in 0 2 4 8 16 30; do
            sleep "$delay"
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
                --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq -- "$ARTIFACT_ID"; then
              exit 0
            fi
          done
          echo "::error::Uploaded Pages artifact $ARTIFACT_ID is unavailable in run $GITHUB_RUN_ID."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
